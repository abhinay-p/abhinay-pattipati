<!doctype html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Abhinay Pattipati</title>
  <meta name="description" content="Film photographs by Abhinay Pattipati.">
  <meta name="theme-color" content="#1f2a33">
  <script>
    // Photo links from before this landing page existed (/#portra400_12)

    if (/^#[\w.-]+$/.test(location.hash)) location.replace("photos.html" + location.hash);
  </script>
  <link rel="stylesheet" href="css/photo.css">

<body class="landing">
  <!-- Fallback if WebGL is unavailable: the photograph, blurred. -->
  <div class="landing-bg" aria-hidden="true" style="background-image: url('images/film/thumbs/phoenix200_09.jpg')"></div>
  <!-- One of the landscape photographs as a pixel-and-grain pattern that ripples under the pointer. -->
  <canvas class="landing-canvas" id="landing-canvas" aria-hidden="true"></canvas>

  <!-- No text: the whole screen is the way in to the photographs. -->
  <a class="landing-link" href="photos.html" aria-label="Abhinay Pattipati. View photographs"></a>

  <script src="js/landing.js" type="module"></script>
</body>
</html>
