<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Light table · Abhinay Pattipati</title>
  <meta name="description" content="A light table for film photographs by Abhinay Pattipati: drag, throw, stack and share them.">
  <meta name="theme-color" content="#f6f2ea">
  <link rel="icon" href="data:,">
  <!-- Ask for everything at once, instead of one file leading to the next. -->
  <script>
    window.photosRequest = fetch("content/photos.json", { cache: "no-cache" });
    window.photosRequest.catch(() => {}); // the page itself reports a failure
  </script>
  <link rel="stylesheet" href="css/photo.css">
  <link rel="stylesheet" href="css/table.css">
  <link rel="modulepreload" href="js/table.js">
  <link rel="modulepreload" href="js/placing.js">
  <link rel="modulepreload" href="js/common.js">
  <link rel="modulepreload" href="js/image.js">
  <link rel="modulepreload" href="js/ambient.js">
  <link rel="modulepreload" href="js/motion.js">
  <link rel="modulepreload" href="js/viewer.js">
  <link rel="modulepreload" href="js/order.js">
  <!-- Karla arrives without holding up the page; the system font stands in. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Karla:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
</head>
<body class="table-page">
  <header class="bar">
    <nav aria-label="Main"><a href="photos.html">Photographs</a><a href="gallery.html">Gallery</a><a href="design.html">Design</a></nav>
  </header>

  <main class="table" id="table" aria-label="Light table"></main>

  <div class="table-tools" role="group" aria-label="Table">
    <button type="button" id="deal">Deal again</button>
    <button type="button" id="tidy">Tidy</button>
    <a id="add" href="gallery.html#pick=">Add photos</a>
    <button type="button" id="copy">Copy link</button>
    <span id="how">Drag, throw and stack. Double-click to open. Keys: arrows move (Shift for further), [ and ] turn, Page Up and Page Down stack, Enter opens, Delete removes.</span>
    <span id="said" role="status"></span>
  </div>

  <dialog class="viewer" id="viewer" aria-label="Photo viewer">
    <button class="v-btn v-close" id="v-close">Close</button>
    <div class="stage"><img id="v-img" alt=""></div>
    <footer>
      <button class="v-btn" id="v-prev" aria-label="Previous photo">Prev</button>
      <div class="caption"><div id="v-line1"></div><div id="v-line2"></div></div>
      <button class="v-btn" id="v-next" aria-label="Next photo">Next</button>
    </footer>
  </dialog>

  <script src="js/table.js" type="module"></script>
</body>
</html>
